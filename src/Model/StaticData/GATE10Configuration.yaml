              macro: "setPathToELEFile"
              multiplicity: False
          property:
            type: select
            default_value: [null]
        - label_list:
            - label: "Unit of Length"
              macro: "setUnitOfLength"
              multiplicity: False
          property:
            type: dropdown
            default_value: [pc]
            value_list: LENGTH_UNITS
        - label_list:
            - label: "Path to Attribute Map"
              macro: "setPathToAttributeMap"
              multiplicity: False
          property:
            type: select
            default_value: [null]
    
      volume_general:
        volume_general_list: ["material", "placement_parameters", "moving_parameters", "visualization_parameters"]

        material:
          - label_list:
            - label: "Material Settings"
              macro: ""
              multiplicity: False
            property:
              type: label
          
          - label_list:
            - label: "Set Material"
              macro: "setMaterial"
              multiplicity: False
            property:
              type: material_dropdown
              default_value: [0]
        
        shape:
          - label_list:
            - label: "Shape of the Volume"
              macro: ""
              multiplicity: False
            property:
              type: macro
              default_value: [""]
          
          - label_list:
            - label: "Repeater Type"
              macro: ""
              multiplicity: False
            property:
              type: macro
              default_value: [""]

        placement_parameters:
          - label_list:
            - label: "Placement Settings"
              macro: ""
              multiplicity: False
            property:
              type: label

          - label_list :
            - label: "Set Translation"
              macro: "placement/setTranslation"
              multiplicity: False
            property:
              type: text
              default_value: [0, 0, 0]
              units: LENGTH_UNITS
              default_unit_index: 3
          
          - label_list:
            - label: "Phi Angle (XY Plane)"
              macro: "placement/setPhiOfTranslation"
              multiplicity: False
            - label: "Theta Angle (Z Axis)"
              macro: "placement/setThetaOfTranslation"
              multiplicity: False
            property:
              type: text
