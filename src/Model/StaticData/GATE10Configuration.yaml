
gate:
  object_path:
    GATE: 
      yaml_path: "gate/parameter/gate"
      object_path: "gate"
    SYSTEMS: 
      yaml_path: "gate/parameter/systems/general"
      object_path: "gate/systems"
    PHYSICS:
      yaml_path: "gate/parameter/physics"
      object_path: "gate/physics"
    SOURCE:
      yaml_path: "gate/parameter/source/source_general"
      object_path: "gate/source"
    #DIGITIZER: "gate/digitizer"
    OUTPUT:
      yaml_path: "gate/parameter/output"
      object_path: "gate/output"
    ACQUISITION:
      yaml_path: "gate/parameter/acquisition"
      object_path: "gate/acquisition"
    WORLD: 
      yaml_path: "gate/parameter/volume/box/ - "
      object_path: "gate/world"
    VIS:
      yaml_path: "gate/parameter/vis"
      object_path: "vis"

  units:
    LENGTH_UNITS : ['pc', 'km', 'm', 'cm', 'mm', 'mum', 'nm', 'Ang']
    SURFACE_UNITS : ['km2', 'm2', 'cm2', 'mm2']
    VOLUME_UNITS: ['km3', 'm3', 'cm3', 'mm3']
    ANGLE_UNITS: ['rad', 'mrad', 'sr', 'deg']
    TIME_UNITS: ['s', 'ms', 'mus', 'ns', 'ps']
    SPEED_UNITS: ['m/s', 'cm/s', 'mm/s', 'm/min', 'cm/min', 'mm/min', 'm/h', 'cm/h', 'mm/h']
    ANGULAR_SPEED_UNITS: ['rad/s', 'deg/s', 'rot/s', 'rad/min', 'deg/min', 'rot/min', 'rad/h', 'deg/h', 'rot/h']
    ENERGY_UNITS: ['eV', 'KeV', 'MeV', 'GeV', 'TeV', 'PeV', 'j']
    ACTIVITY_DOSE_UNITS: ['Bq', 'Ci', 'Gy']
    AMOUNT_OF_SUBSTANCE_UNITS: ['mol']
    MASS_UNITS: ['mg', 'g', 'kg']
    VOLUMIC_MASS_UNITS: ['g/cm3', 'mg/cm3', 'kg/m3']
    ELECTRIC_CHARGE_UNITS: ['e+', 'C', 'muA', 'nA']
    ELECTRIC_CURRENT_UNITS: ['A', 'mA']
    ELECTRIC_POTENTIAL_UNITS: ['V', 'kV', 'MV', 'kG']
    MAGNETIC_FLUX_UNITS: ['Wb', 'T', 'G']
    TEMPERATURE_UNITS: ['K']
    FORCE_PRESSURE_UNITS: ['N', 'Pa', 'bar', 'atm']
    POWER_UNITS: ['W']
    FREQUENCY_UNITS: ['Hz', 'kHz', 'MHz']
    NO_UNITS: []
    AXIS_UNITS: [" - ", " X ", " Y ", " Z "]
    COLORS: ["white", "gray", "black", "red", "green", "blue", "cyan", "magenta", "yellow"]
    LINE_STYLE: ["dashed", "dotted", "unbroken"]
    INC_EXC: ["exclude", "include"]
    REPEATER_TYPES: [" - ", "linear", "ring", "cubicArray", "quadrant", "sphere", "genericRepeater"]
    VIEWER_TYPES: [" - ", "OGL", "OGLS","OGLSQt", "OGLSX", "OGLI", "OGLIQt", "OGLIX", "DAWNFILE", "VRML2FILE"]
    PHYSICS_LISTS: [" - ", "FTFP_BERT", "FTFP_BERT_ATL", "FTFP_BERT_HP", "FTFP_BERT_TRV", "FTFP_INCLXX", "FTFQGSP_BERT", "FTF_BIC", "LBE", "NuBeam", "QBBC", "QBBC_ABLA", "QGSP_BERT", "QGSP_BERT_HP", "QGSP_BIC", "QGSP_BIC_AllHP", "QGSP_BIC_HP", "QGSP_BIC_HPT", "QGSP_FTFP_BERT", "QGSP_INCLXX", "QGS_BIC", "Shielding", "ShieldingLEND"]
    RANDOM_ENGINES: ["Ranlux64", "JamesRandom", "MixMaxRng", "MersenneTwister"]
    RANDOM_SEED_MODE: ["default", "auto", "manual"]
    SOURCE_PARTICLES: ["gamma", "e+", "e-", "proton", "neutron", "ion", "GenericIon"]
    SOURCE_ENERGY_TYPES: ["Mono", "Lin", "Pow", "Exp", "Gauss", "Brem", "Bbody", "Cdg", "UserSpectrum", "Arb", "Epn", "Fluor18"]
    SOURCE_ANG_TYPES: ["iso"]
    SOURCE_DOMAINS: ["Point", "Beam", "Plane", "Surface", "Volume"]
    SOURCE_VOLUME_SHAPES: ["Sphere", "Ellipsoid", "Cylinder", "Para"]
    SPECIAL_SOURCE_TYPES: [" - ", "backtoback"]
    ROTATION_DIRECTIONS: ["negative", "positive"]
    EXTENDED_MODELS: ["sg", "pPs", "oPs", "Ps"]
    SYSTEMS_STRUCTURE_TYPE: ["scanner", "CTscanner", "CPET", "cylindricalPET", "SPECThead", "ecat", "ecatAccel", "OPET", "OpticalSystems"]
    SD_TYPE: ["CrystalSD", "PhantomSD"]
  systems_components:
    scanner:
      component: ["level1", "level2", "level3", "level4", "level5"]
      geometry: ["any", "any", "any", "any", "any"]

    CTscanner:
      component: ["module", "cluster", "pixel"]
      geometry: ["box", "box", "box"]

    CPET:
      component: ["sector", "cassette", "module", "crystal", "layer"]
      geometry: ["cylinder", "cylinder", "box", "box", "box"]
    
    cylindricalPET:
      component: ["rsector", "module", "submodule", "crystal", "layer"]
      geometry: ["box", "box", "box", "box", "box"]
    
    SPECThead:
      component: ["crystal", "pixel"]
      geometry: ["any", "any"]
      
    ecat:
      component: ["block", "crystal"]
      geometry: ["box", "box"]
    
    ecatAccel:
      component: ["block", "crystal"]
      geometry: ["box", "box"]
    
    OPET:
      component: ["rsector", "module", "submodule", "crystal", "layer"]
      geometry: ["box", "box", "box", "box", "wedge"]

    OpticalSystem:
      component: ["crystal", "pixel"]
      geometry: ["any", "any"]

  parameter:
    volume:
      box:
        - label_list:
            - label: "X Length"
              macro: "setXLength"
            - label: "Y Length"
              macro: "setYLength"
            - label: "Z Length"
              macro: "setZLength"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3

      sphere:
        - label_list:
            - label: "Internal Radius"
              macro: "setRmin"
            - label: "External Radius"
              macro: "setRmax"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3
        - label_list:
            - label: "Start Phi Angle"
              macro: "setPhiStart"
            - label: "Phi Angular Span"
              macro: "setDeltaPhi"
            - label: "Start Theta Angle"
              macro: "setThetaStart"
            - label: "Theta Angular Span"
              macro: "setDeltaTheta"
          property:
            type: text
            default_value: [0]
            units: ANGLE_UNITS
            default_unit_index: 3

      cylinder:
        - label_list:
            - label: "Internal Radius"
              macro: "setRmin"
            - label: "External Radius"
              macro: "setRmax"
            - label: "Height"
              macro: "setHeight"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3
        - label_list:
            - label: "Start Phi Angle"
              macro: "setPhiStart"
            - label: "Phi Angular Span"
              macro: "setDeltaPhi"
          property:
            type: text
            default_value: [0]
            units: ANGLE_UNITS
            default_unit_index: 3

      cone:
        - label_list:
            - label: "Internal Radius 1"
              macro: "setRmin1"
            - label: "External Radius 1"
              macro: "setRmax1"
            - label: "Internal Radius 2"
              macro: "setRmin2"
            - label: "External Radius 2"
              macro: "setRmax2"
            - label: "Height"
              macro: "setHeight"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3
        - label_list:
            - label: "Start Phi Angle"
              macro: "setPhiStart"
            - label: "Phi Angular Span"
              macro: "setDeltaPhi"
          property:
            type: text
            default_value: [0]
            units: ANGLE_UNITS
            default_unit_index: 3

      ellipsoid:
        - label_list:
            - label: "Half Axis Length X"
              macro: "setXLength"
            - label: "Half Axis Length Y"
              macro: "setYLength"
            - label: "Half Axis Length Z"
              macro: "setZLength"
            - label: "Z Bottom Cut"
              macro: "setZBottomCut"
            - label: "Z Top Cut"
              macro: "setZTopCut"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3

      elliptical tube:
        - label_list:
            - label: "Semimajor Axis Length"
              macro: "setLong"
            - label: "Semiminor Axis Length"
              macro: "setShort"
            - label: "Height"
              macro: "setHeight"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3

      hexagon:
        - label_list:
            - label: "Radius"
              macro: "setRadius"
            - label: "Height"
              macro: "setHeight"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3

      wedge:
        - label_list:
            - label: "Shorter Side Length X"
              macro: "setNarrowerXLength"
            - label: "Wedge Length X"
              macro: "setXLength"
            - label: "Wedge Length Y"
              macro: "setYLength"
            - label: "Wedge Length Z"
              macro: "setZLength"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3

      tet-mesh-box:
        - label_list:
            - label: "Path to .ele File"
              macro: "setPathToELEFile"
          property:
            type: select
            default_value: [null]
        - label_list:
            - label: "Unit of Length"
              macro: "setUnitOfLength"
          property:
            type: dropdown
            default_value: [pc]
            value_list: LENGTH_UNITS
            default_unit_index: null
        - label_list:
            - label: "Path to Attribute Map"
              macro: "setPathToAttributeMap"
          property:
            type: select
            default_value: [null]
    
      volume_general:
        volume_general_list: ["placement_parameters", "moving_parameters", "visualization_parameters"]

        material:
          - label_list:
            - label: "Material Settings"
              macro: ""
            property:
              type: "label"
          
          - label_list:
            - label: "Set Material"
              macro: "setMaterial"
            property:
            type: "material_dropdown"
            default_value: [0]
      

        placement_parameters:
          - label_list:
            - label: "Placement Settings"
              macro: ""
            property:
              type: label

          - label_list :
            - label: "Set Translation"
              macro: "placement/setTranslation"
            property:
              type: text
              default_value: [0, 0, 0]
              units: LENGTH_UNITS
              default_unit_index: 3
          
          - label_list:
            - label: "Phi Angle (XY Plane)"
              macro: "placement/setPhiOfTranslation"
            - label: "Theta Angle (Z Axis)"
              macro: "placement/setThetaOfTranslation"
            property:
              type: text
              default_value: [0]
              units: ANGLE_UNITS
              default_unit_index: 3
          
          - label_list:
            - label: "Translation Magnitude"
              macro: "placement/setMagOfTranslation"
            property:
              type: text
              default_value: [0]
              units: LENGTH_UNITS
              default_unit_index: 3
          
          - label_list:
            - label: "Rotation Axis"
              macro: "placement/setRotationAxis"
            property:
              type: dropdown
              default_value: [" - "]
              value_list: AXIS_UNITS
          
          - label_list:
            - label: "Rotation Angle"
              macro: "placement/setRotationAngle"
            property:
              type: text
              default_value: [0]
              units: ANGLE_UNITS
              default_unit_index: 3
          
          - label_list:
            - label: "Axis"
              macro: "placement/setAxis"
            - label: "Align To Axis"
              macro: "placement/alignToX"
            property:
              type: dropdown
              default_value: [" - "]
              value_list: AXIS_UNITS
        
        moving_parameters:
          - label_list:
            - label: "Moving Settings"
              macro: ""
            property:
              type: label

          - label_list:
            - label: "Enable Translational Movement"
              macro: "moves/insert"
            property:
              type: checkbox
              default_value: [False]
          
          - label_list:
            - label: "Translation Speed"
              macro: "translation/setSpeed"
            property:
              type: text
              default_value: [0, 0, 0]
              units: SPEED_UNITS
              default_unit_index: 1

          - label_list:
            - label: "Enable Rotational Movement"
              macro: "moves/insert"
            property:
              type: checkbox
              default_value: [False]

          - label_list:
            - label: "Rotation Speed"
              macro: "rotation/setSpeed"
            property:
              type: text
              default_value: [0]
              units: ANGULAR_SPEED_UNITS
              default_unit_index: 0

          - label_list:
            - label: "Moving Rotation Axis"
              macro: "rotation/setAxis"
            property:
              type: dropdown
              default_value: [" - "]
              value_list: AXIS_UNITS

          - label_list:
            - label: "Enable Orbiting Movement"
              macro: "moves/insert"
            property:
              type: checkbox
              default_value: [False]

          - label_list:
            - label: "Orbiting Speed"
              macro: "orbiting/setSpeed"
            property:
              type: text
              default_value: [0]
              units: ANGULAR_SPEED_UNITS
              default_unit_index: 0

          - label_list:
            - label: "Orbiting Point 1"
              macro: "orbiting/setPoint1"
            - label: "Orbiting Point 2"
              macro: "orbiting/setPoint2"
            property:
              type: text
              default_value: [0, 0, 0]
              units: LENGTH_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Enable Wobbling Movement"
              macro: "moves/insert"
            property:
              type: checkbox
              default_value: [False]

          - label_list:
            - label: "Wobbling Amplitude"
              macro: "osc-trans/setAmplitude"
            property:
              type: text
              default_value: [0, 0, 0]
              units: LENGTH_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Wobbling Frequency"
              macro: "osc-trans/setFrequency"
            property:
              type: text
              default_value: [0]
              units: FREQUENCY_UNITS
              default_unit_index: 0

          - label_list:
            - label: "Wobbling Period"
              macro: "osc-trans/setPeriod"
            property:
              type: text
              default_value: [0]
              units: TIME_UNITS
              default_unit_index: 0

          - label_list:
            - label: "Wobbling Phase"
              macro: "osc-trans/setPhase"
            property:
              type: text
              default_value: [0]
              units: ANGLE_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Enable Eccentric Rotation"
              macro: "moves/insert"
            property:
              type: checkbox
              default_value: [False]

          - label_list:
            - label: "Eccentric Rot Shift"
              macro: "eccent-rot/setSpeed"
            property:
              type: text
              default_value: [0, 0, 0]
              units: LENGTH_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Eccentric Rot Speed"
              macro: "eccent-rot/setSpeed"
            property:
              type: text
              default_value: [0]
              units: ANGULAR_SPEED_UNITS
              default_unit_index: 0

          - label_list:
            - label: "Enable Generic Movement"
              macro: "moves/insert"
            property:
              type: checkbox
              default_value: [False]

          - label_list:
            - label: "Generic Movement Filepath"
              macro: "genericMove/setPlacementsFilename"
            property:
              type: select
              default_value: [null]

          - label_list:
            - label: "Enable Generic Repeater Move"
              macro: "moves/insert"
            property:
              type: checkbox
              default_value: [False]

          - label_list:
            - label: "Generic Repeater Filepath"
              macro: "genericRepeaterMove/setPlacementsFilename"
            property:
              type: select
              default_value: [null]

          - label_list:
            - label: "Use Relative Translation"
              macro: "genericRepeaterMove/useRelativeTranslation"
            property:
              type: checkbox
              default_value: [False]
          
        visualization_parameters:
          - label_list:
            - label: "Visualization Settings"
              macro: ""
            property:
              type: label

          - label_list:
            - label: "Color"
              macro: "setColor"
            property:
              type: dropdown
              default_value: [0]
              value_list: COLORS
          
          - label_list:
            - label: "IsVisible"
              macro: "setVisible"
            property:
              type: checkbox
              default_value: [True]

          - label_list:
            - label: "Hide Daughters"
              macro: "setDaughtersInvisible"
            property:
              type: checkbox
              default_value: [False]

          - label_list:
            - label: "Line Style"
              macro: "setLineStyle"
            property:
              type: dropdown
              default_value: [0]
              value_list: LINE_STYLE

          - label_list:
            - label: "Line Width"
              macro: "setLineWidth"
            property:
              type: text
              default_value: [0]
              units: NO_UNITS
              default_unit_index: null

          - label_list:
            - label: "Force Solid"
              macro: "forceSolid"
            - label: "Force Wireframe"
              macro: "forceWireframe"
            property:
              type: checkbox
              default_value: [False]

      volume_repeater:
        " - ": []

        linear:
          - label_list:
            - label: "Insert Linear Repeater"
              macro: ""
            property:
              type: label

          - label_list:
            - label: "Repeat Number"
              macro: "linear/setRepeatNumber"
            property:
              type: text
              default_value: [1]
              units: NO_UNITS
              default_unit_index: null

          - label_list:
            - label: "Repeat Vector (X, Y, Z)"
              macro: "linear/setRepeatVector"
            property:
              type: text
              default_value: [0, 0, 1]
              units: NO_UNITS
              default_unit_index: null

          - label_list:
            - label: "Auto Center"
              macro: "linear/autoCenter"
            property:
              type: checkbox
              default_value: [True]

        ring:
          - label_list:
            - label: "Insert Ring Repeater"
              macro: ""
            property:
              type: label

          - label_list:
            - label: "Repeat Number"
              macro: "ring/setRepeatNumber"
            property:
              type: text
              default_value: [1]
              units: NO_UNITS
              default_unit_index: null

          - label_list:
            - label: "Axis Point 1 (X, Y, Z)"
              macro: "ring/setPoint1"
            property:
              type: text
              default_value: [0, 1, 0]
              units: LENGTH_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Axis Point 2 (X, Y, Z)"
              macro: "ring/setPoint2"
            property:
              type: text
              default_value: [0, 0, 0]
              units: LENGTH_UNITS
              default_unit_index: 3

          - label_list:
            - label: "First Angle"
              macro: "ring/setFirstAngle"
            property:
              type: text
              default_value: [0]
              units: ANGLE_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Angular Span"
              macro: "ring/setAngularSpan"
            property:
              type: text
              default_value: [360]
              units: ANGLE_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Auto Rotation"
              macro: "ring/enableAutoRotation"
            property:
              type: checkbox
              default_value: [True]

        cubicArray:
          - label_list:
            - label: "Insert Cubic Array"
              macro: ""
            property:
              type: label

          - label_list:
            - label: "Repeat X"
              macro: "cubicArray/setRepeatNumberX"
            - label: "Repeat Y"
              macro: "cubicArray/setRepeatNumberY"
            - label: "Repeat Z"
              macro: "cubicArray/setRepeatNumberZ"
            property:
              type: text
              default_value: [1]
              units: NO_UNITS
              default_unit_index: null

          - label_list:
            - label: "Repeat Vector (X, Y, Z)"
              macro: "cubicArray/setRepeatVector"
            property:
              type: text
              default_value: [0, 5, 15]
              units: NO_UNITS
              default_unit_index: null

          - label_list:
            - label: "Auto Center"
              macro: "cubicArray/autoCenter"
            property:
              type: checkbox
              default_value: [True]

        quadrant:
          - label_list:
            - label: "Insert Quadrant"
              macro: ""
            property:
              type: label

          - label_list:
            - label: "Line Number"
              macro: "quadrant/setLineNumber"
            property:
              type: text
              default_value: [5]
              units: NO_UNITS
              default_unit_index: null

          - label_list:
            - label: "Orientation"
              macro: "quadrant/setOrientation"
            property:
              type: text
              default_value: [90]
              units: ANGLE_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Copy Spacing"
              macro: "quadrant/setCopySpacing"
            property:
              type: text
              default_value: [6]
              units: LENGTH_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Max Range"
              macro: "quadrant/setMaxRange"
            property:
              type: text
              default_value: [30]
              units: LENGTH_UNITS
              default_unit_index: 3

        sphere:
          - label_list:
            - label: "Insert Sphere Repeater"
              macro: ""
            property:
              type: label

          - label_list:
            - label: "Sphere Radius"
              macro: "sphere/setRadius"
            property:
              type: text
              default_value: [25]
              units: LENGTH_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Repeat With Theta"
              macro: "sphere/setRepeatNumberWithTheta"
            property:
              type: text
              default_value: [10]
              units: NO_UNITS
              default_unit_index: null

          - label_list:
            - label: "Repeat With Phi"
              macro: "sphere/setRepeatNumberWithPhi"
            property:
              type: text
              default_value: [3]
              units: NO_UNITS
              default_unit_index: null

          - label_list:
            - label: "Theta Angle"
              macro: "sphere/setThetaAngle"
            property:
              type: text
              default_value: [36]
              units: ANGLE_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Phi Angle"
              macro: "sphere/setPhiAngle"
            property:
              type: text
              default_value: [20]
              units: ANGLE_UNITS
              default_unit_index: 3

        genericRepeater:
          - label_list:
            - label: "Insert Generic Repeater"
              macro: ""
            property:
              type: label

          - label_list:
            - label: "Placement File"
              macro: "genericRepeater/setPlacementsFilename"
            property:
              type: select
              default_value: [null]

          - label_list:
            - label: "Relative Translation"
              macro: "genericRepeater/useRelativeTranslation"
            property:
              type: checkbox
              default_value: [True]         

      attach_systems:
        - label_list:
          - label: "Attach Systems"
            macro: ""
          property:
            type: label
        
        - label_list:
          - label: "Level selection"
            macro: attach
          property:
            type: dynamic_dropdown
            default_value: [0]
            object_path: ["SYSTEMS"] # This path direct to the gateObject to search. 
            object_label: ["Systems Structure Type"] # This is the label name in which the value_list is stored
            object_label_index: [0] # Index of the field to get the value
            list_path: "gate/systems_components/&0/component"
      
