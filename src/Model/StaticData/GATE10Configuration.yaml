              path: "placement/setRotationAxis"
            property:
              type: dropdown
              default_value: [" - "]
              value_list: AXIS_UNITS
          
          - label_list:
            - label: "Rotation Angle"
              path: "placement/setRotationAngle"
            property:
              type: text
              default_value: [0]
              units: ANGLE_UNITS
              default_unit_index: 3
          
          - label_list:
            - label: "Axis"
              path: "placement/setAxis"
            - label: "Align To Axis"
              path: "placement/alignToX"
            property:
              type: dropdown
              default_value: [" - "]
              value_list: AXIS_UNITS
        
        moving_parameters:
          - label_list:
            - label: "Moving Settings"
              path: ""
            property:
              type: label

          - label_list:
            - label: "Enable Translational Movement"
              path: "moves/insert"
            property:
              type: checkbox
              default_value: [False]
          
          - label_list:
