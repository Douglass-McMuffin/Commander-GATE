        - label_list:
            - label: "Internal Radius"
              macro: "setRmin"
              multiplicity: False
            - label: "External Radius"
              macro: "setRmax"
              multiplicity: False
            - label: "Height"
              macro: "setHeight"
              multiplicity: False
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
