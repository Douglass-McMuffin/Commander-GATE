  parameter:
    volume:
      box:
        - label_list:
          - label: "X Length"
            macro: "setXLength"
            multiplicity: False
            multiplicity: False
          - label: "Y Length"
            macro: "setYLength"
            multiplicity: False
          - label: "Z Length"
            macro: "setZLength"
            multiplicity: False
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3

      sphere:
        - label_list:
            - label: "Internal Radius"
              macro: "setRmin"
              multiplicity: False
            - label: "External Radius"
              macro: "setRmax"
              multiplicity: False
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3
        - label_list:
            - label: "Start Phi Angle"
              macro: "setPhiStart"
              multiplicity: False
            - label: "Phi Angular Span"
              macro: "setDeltaPhi"
              multiplicity: False
            - label: "Start Theta Angle"
              macro: "setThetaStart"
              multiplicity: False
            - label: "Theta Angular Span"
              macro: "setDeltaTheta"
              multiplicity: False
          property:
            type: text
            default_value: [0]
            units: ANGLE_UNITS
            default_unit_index: 3

