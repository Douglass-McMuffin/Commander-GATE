            - label: "Shorter Side Length X"
              macro: "setNarrowerXLength"
              multiplicity: False
            - label: "Wedge Length X"
              macro: "setXLength"
              multiplicity: False
            - label: "Wedge Length Y"
              macro: "setYLength"
              multiplicity: False
            - label: "Wedge Length Z"
              macro: "setZLength"
              multiplicity: False
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
