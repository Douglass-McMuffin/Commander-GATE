            property:
              type: checkbox
              default_value: [False]

          - label_list:
            - label: "Generic Movement Filepath"
              path: "genericMove/setPlacementsFilename"
            property:
              type: select
              default_value: [null]
              units: NO_UNITS
              default_unit_index: null

          - label_list:
            - label: "Enable Generic Repeater Move"
              path: "moves/insert"
            property:
              type: checkbox
              default_value: [False]

          - label_list:
            - label: "Generic Repeater Filepath"
              path: "genericRepeaterMove/setPlacementsFilename"
            property:
              type: select
              default_value: [null]
              units: NO_UNITS
              default_unit_index: null

          - label_list:
            - label: "Use Relative Translation"
              path: "genericRepeaterMove/useRelativeTranslation"
            property:
              type: checkbox
              default_value: [False]
          
        visualization_parameters:
          - label_list:
            - label: "Visualization Settings"
              path: ""
            property:
              type: label

          - label_list:
            - label: "Color"
              path: "setColor"
            property:
              type: dropdown
              default_value: [0]
              value_list: COLORS
          
          - label_list:
            - label: "IsVisible"
              path: "setVisible"
            property:
              type: checkbox
              default_value: [True]

          - label_list:
            - label: "Hide Daughters"
              path: "setDaughtersInvisible"
            property:
              type: checkbox
              default_value: [False]

          - label_list:
