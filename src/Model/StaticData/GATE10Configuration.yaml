              macro: ""
              multiplicity: False
            property:
              type: label
          
          - label_list:
            - label: "Set Material"
              macro: "setMaterial"
              multiplicity: False
            property:
              type: material_dropdown
              default_value: [0]

        placement_parameters:
          - label_list:
            - label: "Placement Settings"
              macro: ""
              multiplicity: False
            property:
              type: label

          - label_list :
            - label: "Set Translation"
              macro: "placement/setTranslation"
              multiplicity: False
            property:
              type: text
              default_value: [0, 0, 0]
              units: LENGTH_UNITS
              default_unit_index: 3
          
          - label_list:
            - label: "Phi Angle (XY Plane)"
              macro: "placement/setPhiOfTranslation"
              multiplicity: False
            - label: "Theta Angle (Z Axis)"
              macro: "placement/setThetaOfTranslation"
              multiplicity: False
            property:
              type: text
              default_value: [0]
              units: ANGLE_UNITS
              default_unit_index: 3
          
          - label_list:
            - label: "Translation Magnitude"
              macro: "placement/setMagOfTranslation"
              multiplicity: False
            property:
              type: text
              default_value: [0]
              units: LENGTH_UNITS
              default_unit_index: 3
          
          - label_list:
            - label: "Rotation Axis"
              macro: "placement/setRotationAxis"
              multiplicity: False
            property:
              type: dropdown
              default_value: [" - "]
              value_list: AXIS_UNITS
          
          - label_list:
            - label: "Rotation Angle"
              macro: "placement/setRotationAngle"
              multiplicity: False
            property:
              type: text
              default_value: [0]
              units: ANGLE_UNITS
              default_unit_index: 3
          
          - label_list:
            - label: "Axis"
              macro: "placement/setAxis"
              multiplicity: False
            - label: "Align To Axis"
              macro: "placement/alignToX"
              multiplicity: False
            property:
              type: dropdown
              default_value: [" - "]
              value_list: AXIS_UNITS
        
        moving_parameters:
          - label_list:
