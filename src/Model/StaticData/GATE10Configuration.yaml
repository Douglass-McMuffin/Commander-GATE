      object_path: "/gate"
    SYSTEMS: 
      yaml_path: "gate/parameter/systems/general"
      object_path: "/gate/systems"
    PHYSICS:
      yaml_path: "gate/parameter/physics/physics_general"
      object_path: "/gate/physics"
    SOURCE:
      yaml_path: "gate/parameter/source/source_folder"
      object_path: "/gate/source"
    ACTOR:
      yaml_path: "gate/parameter/actor/actor_folder"
      object_path: "/gate/actor"
    DIGITIZER: 
      yaml_path: "gate/parameter/digitizer/digitizer_folder"
      object_path: "/gate/digitizer"
    OUTPUT:
      yaml_path: "gate/parameter/output"
      object_path: "/gate/output"
    ACQUISITION:
      yaml_path: "gate/parameter/acquisition"
      object_path: "/gate/acquisition"
    DISTRIBUTIONS:
