    WORLD: 
      yaml_path: "gate/parameter/volume/box/ - "
      object_path: "/gate/world"
    VIS:
      yaml_path: "gate/parameter/vis"
      object_path: "/vis"

  units:
    LENGTH_UNITS : ['pc', 'km', 'm', 'cm', 'mm', 'mum', 'nm', 'Ang']
    LENGTH_INVERSE_UNITS : ['1/m', '1/cm', '1/mm']
    SURFACE_UNITS : ['km2', 'm2', 'cm2', 'mm2']
    DIFFUSION_UNITS : ['m2/s', 'cm2/s', 'mm2/s']
    VOLUME_UNITS: ['km3', 'm3', 'cm3', 'mm3']
    ANGLE_UNITS: ['rad', 'mrad', 'sr', 'deg']
    TIME_UNITS: ['s', 'ms', 'mus', 'ns', 'ps']
    SPEED_UNITS: ['m/s', 'cm/s', 'mm/s', 'm/min', 'cm/min', 'mm/min', 'm/h', 'cm/h', 'mm/h']
    ANGULAR_SPEED_UNITS: ['rad/s', 'deg/s', 'rot/s', 'rad/min', 'deg/min', 'rot/min', 'rad/h', 'deg/h', 'rot/h']
    ENERGY_UNITS: ['eV', 'KeV', 'MeV', 'GeV', 'TeV']
    ENERGY_LINEAR_DENSITY_UNITS: ['eV/cm', 'KeV/cm', 'MeV/cm', 'GeV/cm']
    INVERSE_ENERGY_UNITS: ['1/eV', '1/KeV', '1/MeV', '1/GeV', '1/TeV', '1/PeV', '1/j']
    ACTIVITY_DOSE_UNITS: ['Bq', 'Ci', 'Gy']
    AMOUNT_OF_SUBSTANCE_UNITS: ['mol']
    MASS_UNITS: ['mg', 'g', 'kg']
    VOLUMIC_MASS_UNITS: ['g/cm3', 'mg/cm3', 'kg/m3']
    ELECTRIC_CHARGE_UNITS: ['e+', 'C', 'muA', 'nA']
    ELECTRIC_CURRENT_UNITS: ['A', 'mA']
    ELECTRIC_POTENTIAL_UNITS: ['V', 'kV', 'MV', 'kG']
    MAGNETIC_FLUX_UNITS: ['Wb', 'T', 'G']
    TEMPERATURE_UNITS: ['K']
    FORCE_PRESSURE_UNITS: ['N', 'Pa', 'bar', 'atm']
    POWER_UNITS: ['W']
    FREQUENCY_UNITS: ['Hz', 'kHz', 'MHz']
    NO_UNITS: []
    AXIS_UNITS: [" - ", "X", "Y", "Z"]
    AXIS_PLANE_UNITS: [" - ", "X", "Y", "Z", "XY", "XZ", "YZ"]
    AXIS_ALL_UNITS: ["X", "Y", "Z" , "XY", "XZ", "YZ", "XYZ"]
    BITSIZE_UNITS: ["B", "KB", "MB", "GB", "TB"]
    COLORS: ["white", "gray", "black", "red", "green", "blue", "cyan", "magenta", "yellow"]
    LINE_STYLE: ["dashed", "dotted", "unbroken"]
    INC_EXC: ["exclude", "include"]
    VOLUME_TYPES: ["box", "sphere", "cylinder", "cone", "ellipsoid", "elliptical tube", "hexagon", "wedge", "tet-mesh-box"]
    REPEATER_TYPES: [" - ", "linear", "ring", "cubicArray", "quadrant", "sphere", "genericRepeater"]
    VIEWER_TYPES: [" - ", "OGL", "OGLS","OGLSQt", "OGLSX", "OGLI", "OGLIQt", "OGLIX", "DAWNFILE", "VRML2FILE"]
    PHYSICS_TYPES: [" - ", 
                    "FTFP_BERT", "FTFP_BERT_HP", "FTFP_BERT_HPT", "FTFP_BERT_ATL",  "FTFP_BERT_TRV", "FTFP_INCLXX", "FTFP_INCLXX_HP", "FTFP_INCLXX_HPT", "FTFQGS_BERT", "FTF_BIC",
                    "QBBC", "QBBC_ABLA", 
                    "QGSP_BERT", "QGSP_BERT_HP", "QGSP_BERT_HPT", "QGSP_FTFP_BERT", "QGSP_INCLXX", "QGSP_INCLXX_HP", "QGSP_INCLXX_HPT", 
                    "QGSP_BIC", "QGSP_BIC_HP", "QGSP_BIC_HPT", "QGSP_BIC_AllHP", "QGSP_BIC_AllHPT",
                    "Shielding", "Shielding_HP", "Shielding_HPT", "ShieldingM", "ShieldingM_HP", "ShieldingM_HPT", "ShieldingLEND",
                    "LBE", "NuBeam",
                    "emstandard", "emstandard_opt1", "emstandard_opt2", "emstandard_opt3", "emlivermore", "emlivermore_polar", "empenelope"]
    PROCESS_TYPES: ["Bremsstrahlung", "Cerenkov", "Compton", "Decay", "ElectronIonisation", "Fictitious", "Fission", "GammaConversion", "NeutronCapture", "HadronElastic", "HadronIonisation", "IonInelastic", "IonIonisation", "MuBremsstrahlung", "MuIonisation", "MuPairProduction", "NanoAbsorption", "NeutronInelastic", "OpticalAbsorption", "OpticalBoundary", "OpticalMie", "OpticalRayleigh", "OpticalWLS", "PhotoElectric", "PionMinusInelastic", "PionPlusInelastic", "PositronAnnihilation", "G4PositronAnnihilation", "ProtonInelastic", "RadioactiveDecay", "RayleighScattering", "Scintillation", "SingleScattering", "XrayBoundary", "eMultipleScattering", "hMultipleScattering"]
    RANDOM_ENGINES: ["Ranlux64", "JamesRandom", "MixMaxRng", "MersenneTwister"]
    RANDOM_SEED_MODE: ["default", "auto", "manual"]
    SOURCE_PARTICLES: ["gamma", "e+", "e-", "proton", "neutron", "user defined"]
    SOURCE_ENERGY_TYPES: ["Mono", "Lin", "Pow", "Exp", "Gauss", "Brem", "Bbody", "Cdg", "UserSpectrum", "Arb", "Epn", "Fluor18"]
    SOURCE_ANG_TYPES: ["iso"]
    SOURCE_DOMAINS: ["Point", "Beam", "Plane", "Surface", "Volume"]
    SOURCE_VOLUME_SHAPES: ["Sphere", "Ellipsoid", "Cylinder", "Para"]
    SOURCE_VOLUME_PLANES: ["Circle", "Annulus", "Ellipsoid", "Square", "Rectangle"]
    SPECIAL_SOURCE_TYPES: [" - ", "backtoback"]
    ROTATION_DIRECTIONS: ["negative", "positive"]
    EXTENDED_MODELS: ["sg", "pPs", "oPs", "Ps"]
    SYSTEMS_STRUCTURE_TYPE: ["scanner", "CTscanner", "CPET", "cylindricalPET", "SPECThead", "ecat", "ecatAccel", "OPET", "OpticalSystem"]
    SD_TYPE: ["CrystalSD", "PhantomSD"]
    POSITION_POLICY: ["energyCentroid", "energyWeightedCentroid", "takeEnergyWinner"]
    READOUT_POLICY: ["takeEnergyWinner", "takeEnergyCentroid"]
    ENERGY_FRAMING_LAW: [" - ", "solidAngleWeighted"]
    DIGITIZER_EFFICIENCY_MODE: ["energy", "crystal"]
    DIGITIZER_DEADTIME_MODE: ["paralysable", "nonparalysable"]
    DIGITIZER_DOI_MODEL: ["dualLayer", "DoIBlurrNegExp"]
    ZERO_ONE_MODE: ["0", "1"]
    HIT_TYPE: ["pre", "post", "middle", "random"]
    PARTICLE_NAME: ["photon", "electron", "positron", "proton", "neutron"]
    DOSE_CALCULATION_ALGORITHM: ["VolumeWeighting", "MassWeighting"]
    CELL_LINE: ["HSG"]
    BIO_PHYSICAL_MODEL: ["NanOx"]
    AVERAGING_METHOD: ["DoseAveraged", "TrackAveraged"]
    PARTICLE_SELECTION_METHOD: ["Atomic Number (Z, A)", "Particle Data Group (PDG)"]


  systems_components:
    scanner:
      component: ["level1", "level2", "level3", "level4", "level5"]
      geometry: ["any", "any", "any", "any", "any"]

    CTscanner:
      component: ["module", "cluster", "pixel"]
      geometry: ["box", "box", "box"]

    CPET:
      component: ["sector", "cassette", "module", "crystal", "layer"]
      geometry: ["cylinder", "cylinder", "box", "box", "box"]
    
    cylindricalPET:
      component: ["rsector", "module", "submodule", "crystal", "layer"]
      geometry: ["box", "box", "box", "box", "box"]
    
    SPECThead:
      component: ["crystal", "pixel"]
      geometry: ["any", "any"]
      
    ecat:
      component: ["block", "crystal"]
      geometry: ["box", "box"]
    
    ecatAccel:
      component: ["block", "crystal"]
      geometry: ["box", "box"]
    
    OPET:
      component: ["rsector", "module", "submodule", "crystal", "layer"]
      geometry: ["box", "box", "box", "box", "wedge"]

    OpticalSystem:
      component: ["crystal", "pixel"]
      geometry: ["any", "any"]

  process_components:
