              macro: "setRmin1"
              multiplicity: False
            - label: "External Radius 1"
              macro: "setRmax1"
              multiplicity: False
            - label: "Internal Radius 2"
              macro: "setRmin2"
              multiplicity: False
            - label: "External Radius 2"
              macro: "setRmax2"
              multiplicity: False
            - label: "Height"
              macro: "setHeight"
              multiplicity: False
          property:
