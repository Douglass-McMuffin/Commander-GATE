              path: "orbiting/setPoint2"
            property:
              type: text
              default_value: [0, 0, 0]
              units: LENGTH_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Enable Wobbling Movement"
              path: "moves/insert"
            property:
              type: checkbox
              default_value: [False]

          - label_list:
            - label: "Wobbling Amplitude"
              path: "osc-trans/setAmplitude"
            property:
              type: text
              default_value: [0, 0, 0]
              units: LENGTH_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Wobbling Frequency"
              path: "osc-trans/setFrequency"
            property:
              type: text
              default_value: [0]
              units: FREQUENCY_UNITS
              default_unit_index: 0

          - label_list:
            - label: "Wobbling Period"
              path: "osc-trans/setPeriod"
            property:
              type: text
              default_value: [0]
              units: TIME_UNITS
              default_unit_index: 0

          - label_list:
            - label: "Wobbling Phase"
              path: "osc-trans/setPhase"
            property:
              type: text
              default_value: [0]
              units: ANGLE_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Enable Eccentric Rotation"
              path: "moves/insert"
            property:
              type: checkbox
              default_value: [False]

          - label_list:
            - label: "Eccentric Rot Shift"
              path: "eccent-rot/setSpeed"
            property:
              type: text
              default_value: [0, 0, 0]
              units: LENGTH_UNITS
              default_unit_index: 3

          - label_list:
            - label: "Eccentric Rot Speed"
              path: "eccent-rot/setSpeed"
            property:
              type: text
              default_value: [0]
              units: ANGULAR_SPEED_UNITS
              default_unit_index: 0

          - label_list:
            - label: "Enable Generic Movement"
