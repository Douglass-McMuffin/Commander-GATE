
gate:
  units:
    LENGTH_UNITS : ['pc', 'km', 'm', 'cm', 'mm', 'mum', 'nm', 'Ang']
    SURFACE_UNITS : ['km2', 'm2', 'cm2', 'mm2']
    VOLUME_UNITS: ['km3', 'm3', 'cm3', 'mm3']
    ANGLE_UNITS: ['rad', 'mrad', 'sr', 'deg']
    TIME_UNITS: ['s', 'ms', 'mus', 'ns', 'ps']
    SPEED_UNITS: ['m/s', 'cm/s', 'mm/s', 'm/min', 'cm/min', 'mm/min', 'm/h', 'cm/h', 'mm/h']
    ANGULAR_SPEED_UNITS: ['rad/s', 'deg/s', 'rot/s', 'rad/min', 'deg/min', 'rot/min', 'rad/h', 'deg/h', 'rot/h']
    ENERGY_UNITS: ['eV', 'KeV', 'MeV', 'GeV', 'TeV', 'PeV', 'j']
    ACTIVITY_DOSE_UNITS: ['Bq', 'Ci', 'Gy']
    AMOUNT_OF_SUBSTANCE_UNITS: ['mol']
    MASS_UNITS: ['mg', 'g', 'kg']
    VOLUMIC_MASS_UNITS: ['g/cm3', 'mg/cm3', 'kg/m3']
    ELECTRIC_CHARGE_UNITS: ['e+', 'C', 'muA', 'nA']
    ELECTRIC_CURRENT_UNITS: ['A', 'mA']
    ELECTRIC_POTENTIAL_UNITS: ['V', 'kV', 'MV', 'kG']
    MAGNETIC_FLUX_UNITS: ['Wb', 'T', 'G']
    TEMPERATURE_UNITS: ['K']
    FORCE_PRESSURE_UNITS: ['N', 'Pa', 'bar', 'atm']
    POWER_UNITS: ['W']
    FREQUENCY_UNITS: ['Hz', 'kHz', 'MHz']
    NO_UNITS: []
    AXIS_UNITS: [" - ", " X ", " Y ", " Z "]
    COLORS: ["white", "gray", "black", "red", "green", "blue", "cyan", "magenta", "yellow"]
    LINE_STYLE: ["dashed", "dotted", "unbroken"]
    INC_EXC: ["exclude", "include"]
    REPEATER_TYPES: [" - ", "linear", "ring", "cubicArray", "quadrant", "sphere", "genericRepeater"]
    VIEWER_TYPES: [" - ", "OGL", "OGLS","OGLSQt", "OGLSX", "OGLI", "OGLIQt", "OGLIX", "DAWNFILE", "VRML2FILE"]
    PHYSICS_LISTS: [" - ", "FTFP_BERT", "FTFP_BERT_ATL", "FTFP_BERT_HP", "FTFP_BERT_TRV", "FTFP_INCLXX", "FTFQGSP_BERT", "FTF_BIC", "LBE", "NuBeam", "QBBC", "QBBC_ABLA", "QGSP_BERT", "QGSP_BERT_HP", "QGSP_BIC", "QGSP_BIC_AllHP", "QGSP_BIC_HP", "QGSP_BIC_HPT", "QGSP_FTFP_BERT", "QGSP_INCLXX", "QGS_BIC", "Shielding", "ShieldingLEND"]
    RANDOM_ENGINES: ["Ranlux64", "JamesRandom", "MixMaxRng", "MersenneTwister"]
    RANDOM_SEED_MODE: ["default", "auto", "manual"]
    SOURCE_PARTICLES: ["gamma", "e+", "e-", "proton", "neutron", "ion", "GenericIon"]
    SOURCE_ENERGY_TYPES: ["Mono", "Lin", "Pow", "Exp", "Gauss", "Brem", "Bbody", "Cdg", "UserSpectrum", "Arb", "Epn", "Fluor18"]
    SOURCE_ANG_TYPES: ["iso"]
    SOURCE_DOMAINS: ["Point", "Beam", "Plane", "Surface", "Volume"]
    SOURCE_VOLUME_SHAPES: ["Sphere", "Ellipsoid", "Cylinder", "Para"]
    SPECIAL_SOURCE_TYPES: [" - ", "backtoback"]
    ROTATION_DIRECTIONS: ["negative", "positive"]
    EXTENDED_MODELS: ["sg", "pPs", "oPs", "Ps"]
    SYSTEM_STRUCTURE_TYPE: ["scanner", "CTscanner", "CPET", "cylindricalPET", "SPECThead", "ecat", "ecatAccel", "OPET", "OpticalSystem"]
    SD_TYPE: [" - ", "crystalSD", "phantomSD"]
  system_components:
    scanner: 
      - name: "level1"
        shape: "any"
        depth: 1
      - name: "level2"
        shape: "any"
        depth: 2
      - name: "level3"
        shape: "any"
        depth: 3
      - name: "level4"
        shape: "any"
        depth: 4
      - name: "level5"
        shape: "any"
        depth: 5

    CTscanner:
      - name: "module"
        shape: "box"
        depth: 1
      - name: "cluster"
        shape: "box"
        depth: 2
      - name: "pixel"
        shape: "box"
        depth: 3

    CPET:
      - name: "sector"
        shape: "cylinder"
        depth: 1
      - name: "cassette"
        shape: "cylinder"
        depth: 2
      - name: "module"
        shape: "box"
        depth: 3
      - name: "crystal"
        shape: "box"
        depth: 4
      - name: "layer"
        shape: "box"
        depth: 5
    
    cylindricalPET:
      - name: "rsector"
        shape: "box"
        depth: 1
      - name: "module"
        shape: "box"
        depth: 2
      - name: "submodule"
        shape: "box"
        depth: 3
      - name: "crystal"
        shape: "box"
        depth: 4
      - name: "layer"
        shape: "box"
        depth: 5
    
    SPECThead:
      - name: "crystal"
        shape: "any"
        depth: 1
      - name: "pixel"
        shape: "any"
        depth: 2
      
    ecat:
      - name: "block"
        shape: "box"
        depth: 1
      - name: "crystal"
        shape: "box"
        depth: 2
    
    ecatAccel:
      - name: "block"
        shape: "box"
        depth: 1
      - name: "crystal"
        shape: "box"
        depth: 2
    
    OPET:
      - name: "rsector"
        shape: "box"
        depth: 1
      - name: "module"
        shape: "box"
        depth: 2
      - name: "submodule"
        shape: "box"
        depth: 3
      - name: "crystal"
        shape: "box"
        depth: 4
      - name: "layer"
        shape: "wedge"
        depth: 5

    OpticalSystem:
      - name: "crystal"
        shape: "any"
        depth: 1
      - name: "pixel"
        shape: "any"
        depth: 2



    CTscanner: ["module", "cluster", "pixel"]

  parameter:
    volume:
      box:
        - label_list:
            - label: "X Length"
              path: "setXLength"
            - label: "Y Length"
              path: "setYLength"
            - label: "Z Length"
              path: "setZLength"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3

      sphere:
        - label_list:
            - label: "Internal Radius"
              path: "setRmin"
            - label: "External Radius"
              path: "setRmax"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3
        - label_list:
            - label: "Start Phi Angle"
              path: "setPhiStart"
            - label: "Phi Angular Span"
              path: "setDeltaPhi"
            - label: "Start Theta Angle"
              path: "setThetaStart"
            - label: "Theta Angular Span"
              path: "setDeltaTheta"
          property:
            type: text
            default_value: [0]
            units: ANGLE_UNITS
            default_unit_index: 3

      cylinder:
        - label_list:
            - label: "Internal Radius"
              path: "setRmin"
            - label: "External Radius"
              path: "setRmax"
            - label: "Height"
              path: "setHeight"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3
        - label_list:
            - label: "Start Phi Angle"
              path: "setPhiStart"
            - label: "Phi Angular Span"
              path: "setDeltaPhi"
          property:
            type: text
            default_value: [0]
            units: ANGLE_UNITS
            default_unit_index: 3

      cone:
        - label_list:
            - label: "Internal Radius 1"
              path: "setRmin1"
            - label: "External Radius 1"
              path: "setRmax1"
            - label: "Internal Radius 2"
              path: "setRmin2"
            - label: "External Radius 2"
              path: "setRmax2"
            - label: "Height"
              path: "setHeight"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3
        - label_list:
            - label: "Start Phi Angle"
              path: "setPhiStart"
            - label: "Phi Angular Span"
              path: "setDeltaPhi"
          property:
            type: text
            default_value: [0]
            units: ANGLE_UNITS
            default_unit_index: 3

      ellipsoid:
        - label_list:
            - label: "Half Axis Length X"
              path: "setXLength"
            - label: "Half Axis Length Y"
              path: "setYLength"
            - label: "Half Axis Length Z"
              path: "setZLength"
            - label: "Z Bottom Cut"
              path: "setZBottomCut"
            - label: "Z Top Cut"
              path: "setZTopCut"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3

      elliptical tube:
        - label_list:
            - label: "Semimajor Axis Length"
              path: "setLong"
            - label: "Semiminor Axis Length"
              path: "setShort"
            - label: "Height"
              path: "setHeight"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3

      hexagon:
        - label_list:
            - label: "Radius"
              path: "setRadius"
            - label: "Height"
              path: "setHeight"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3

      wedge:
        - label_list:
            - label: "Shorter Side Length X"
              path: "setNarrowerXLength"
            - label: "Wedge Length X"
              path: "setXLength"
            - label: "Wedge Length Y"
              path: "setYLength"
            - label: "Wedge Length Z"
              path: "setZLength"
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3

      tet-mesh-box:
        - label_list:
            - label: "Path to .ele File"
              path: "setPathToELEFile"
          property:
            type: select
            default_value: [null]
            units: NO_UNITS
            default_unit_index: null
        - label_list:
            - label: "Unit of Length"
              path: "setUnitOfLength"
          property:
            type: dropdown
            default_value: [pc]
            value_list: LENGTH_UNITS
            default_unit_index: null
        - label_list:
            - label: "Path to Attribute Map"
              path: "setPathToAttributeMap"
          property:
            type: select
            default_value: [null]
            units: NO_UNITS
            default_unit_index: null
    
      volume_general:
        volume_general_list: ["placement_parameters", "moving_parameters", "visualization_parameters"]

        placement_parameters:
          - label_list:
            - label: "Placement Settings"
              path: ""
            property:
              type: label

          - label_list :
            - label: "Set Translation"
              path: "placement/setTranslation"
            property:
              type: text
              default_value: [0, 0, 0]
              units: LENGTH_UNITS
              default_unit_index: 3
          
          - label_list:
            - label: "Phi Angle (XY Plane)"
              path: "placement/setPhiOfTranslation"
            - label: "Theta Angle (Z Axis)"
              path: "placement/setThetaOfTranslation"
            property:
              type: text
              default_value: [0]
              units: ANGLE_UNITS
              default_unit_index: 3
          
          - label_list:
            - label: "Translation Magnitude"
              path: "placement/setMagOfTranslation"
            property:
              type: text
              default_value: [0]
              units: LENGTH_UNITS
              default_unit_index: 3
          
          - label_list:
