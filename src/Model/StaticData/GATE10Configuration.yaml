        - label_list:
            - label: "Half Axis Length X"
              macro: "setXLength"
              multiplicity: False
            - label: "Half Axis Length Y"
              macro: "setYLength"
              multiplicity: False
            - label: "Half Axis Length Z"
              macro: "setZLength"
              multiplicity: False
            - label: "Z Bottom Cut"
              macro: "setZBottomCut"
              multiplicity: False
            - label: "Z Top Cut"
              macro: "setZTopCut"
              multiplicity: False
          property:
            type: text
            default_value: [0]
            units: LENGTH_UNITS
            default_unit_index: 3

      "elliptical tube":
        - label_list:
            - label: "Semimajor Axis Length"
              macro: "setLong"
              multiplicity: False
            - label: "Semiminor Axis Length"
              macro: "setShort"
              multiplicity: False
            - label: "Height"
              macro: "setHeight"
